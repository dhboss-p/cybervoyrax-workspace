<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
<title>{% block title %}CYBERVOYRAX Workspace{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phase44.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phase45.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phase5.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/phase52d-final.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phase52d-complete.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/phase53.css') }}">
<script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body>
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack">{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block body %}{% endblock %}
</body>
</html>
