services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cybervoyrax}
      MYSQL_USER: ${MYSQL_USER:-cybervoyrax}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cybervoyrax}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/001_phase1.sql:/docker-entrypoint-initdb.d/001_phase1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-change-this-root-password} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cybervoyrax}
      MYSQL_USER: ${MYSQL_USER:-cybervoyrax}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cybervoyrax}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cvx_session}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      REMEMBER_SESSION_TTL_DAYS: ${REMEMBER_SESSION_TTL_DAYS:-14}
      REAUTH_TTL_MINUTES: ${REAUTH_TTL_MINUTES:-10}
      UPLOAD_FOLDER: /workspace/instance/uploads
    command: >
      sh -c "
      python scripts/wait_for_db.py &&
      python scripts/migrate_phase2.py &&
      python scripts/migrate_phase5.py &&
        python scripts/migrate_workspace.py &&
      python scripts/bootstrap_database.py &&
      gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 'app:create_app()'
      "
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./instance/uploads:/workspace/instance/uploads

volumes:
  mysql_data:
